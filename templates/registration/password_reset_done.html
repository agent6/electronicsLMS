{% extends "base/base.html" %}
{% block title %}Reset email sent - ObsoleteHQ{% endblock %}
{% block content %}
<section class="container-page grid min-h-[calc(100vh-180px)] place-items-center py-12">
  <div class="form-panel w-full max-w-md">
    <h1 class="text-3xl font-black tracking-[-0.03em]">Check your email</h1>
    <p class="text-ink-soft">If that email matches an account, a password reset link has been sent.</p>
    <a class="btn btn-primary" href="{% url 'login' %}">Back to login</a>
  </div>
</section>
{% endblock %}
