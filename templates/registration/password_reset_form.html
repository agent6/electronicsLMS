{% extends "base/base.html" %}
{% block title %}Reset password - ObsoleteHQ{% endblock %}
{% block content %}
<section class="container-page grid min-h-[calc(100vh-180px)] place-items-center py-12">
  <form class="form-panel w-full max-w-md" method="post">
    {% csrf_token %}
    <h1 class="text-3xl font-black tracking-[-0.03em]">Reset password</h1>
    <p class="text-ink-soft">Enter the private email on your account and we will send a reset link.</p>
    {% if form.errors %}<div class="rounded-lg bg-red-50 p-4 font-bold text-brand-red">{{ form.errors }}</div>{% endif %}
    <label class="field-grid"><span class="font-extrabold">Private email</span>{{ form.email }}</label>
    <button class="btn btn-primary" type="submit">Send reset link</button>
    <a class="font-extrabold text-brand-blue" href="{% url 'login' %}">Back to login</a>
  </form>
</section>
{% endblock %}
