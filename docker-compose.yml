services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-obsoletehq}
      POSTGRES_USER: ${POSTGRES_USER:-obsoletehq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-obsoletehq} -d ${POSTGRES_DB:-obsoletehq}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in the Portainer stack environment}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-obsoletehq.com,www.obsoletehq.com,localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-https://obsoletehq.com,https://www.obsoletehq.com}
      DJANGO_RUN_MIGRATIONS: ${DJANGO_RUN_MIGRATIONS:-true}
      DJANGO_SEED_ON_STARTUP: ${DJANGO_SEED_ON_STARTUP:-true}
      DATABASE_URL: postgres://${POSTGRES_USER:-obsoletehq}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-obsoletehq}
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  postgres_data:
  media_data:
